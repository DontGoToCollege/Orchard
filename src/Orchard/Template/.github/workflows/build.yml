# Orchard build steps 2
# Builds this app on GitHub's Macs. Orchard starts it with a push and collects the results.
# When Orchard gets better steps (a higher number on the first line) it replaces this file at the next build.
# To keep changes of your own, change the first line to anything else: Orchard then leaves the file alone.
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  # Orchard looks for this job by its name, "build", and for what it leaves in "out".
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Fetching the code
        uses: actions/checkout@v4
      - name: Preparing the project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir out
      - name: Building the Mac app
        run: |
          xcodebuild -target macOS -configuration Release CODE_SIGNING_ALLOWED=NO build
          app=$(ls -d build/Release/*.app)
          # Signed "ad hoc" (no Apple account) so Apple-chip Macs agree to run it.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" out/macOS.zip
      - name: Building the iPhone and iPad app
        run: |
          xcodebuild -target iOS -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO build
          mkdir Payload
          cp -R build/Release-iphoneos/*.app Payload/
          zip -qr out/iOS.ipa Payload
      - name: Sending the result back
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: out

  # A simulator takes minutes to start, so the pictures are taken afterwards, on two more Macs at once.
  # The apps above never wait for them.
  screenshots:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - name: Fetching the code
        uses: actions/checkout@v4
      # Orchard shows each step's name while it runs, so the wait is never silent.
      - name: Building the app for the simulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -target iOS -sdk iphonesimulator -configuration Debug ONLY_ACTIVE_ARCH=NO build
      - name: Starting the simulator
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 "${{ matrix.device }}" | grep -oE '[0-9A-F-]{36}')
          echo "udid=$udid" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$udid" -b
      - name: Opening the app and taking the picture
        run: |
          app=$(ls -d build/Debug-iphonesimulator/*.app)
          id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$id"
          sleep 10
          xcrun simctl io "$udid" screenshot "${{ matrix.device }}.png"
      - name: Sending the result back
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.device }}
          path: ${{ matrix.device }}.png
